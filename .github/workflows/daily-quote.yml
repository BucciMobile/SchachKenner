name: daily-quote

# Rotates the "quote of the day" on the About page (README.md): picks one quote
# per UTC day from the verified public-domain pool data/quotes/quotes.json
# (same deterministic day rule as the daily puzzles) and commits the rendered
# block between the daily-quote markers in README.md.

on:
  schedule:
    - cron: '0 0 * * *'   # every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    # The cron push targets main, which is only writable for GitHub Actions in
    # the PRIVATE beta repo. In the public repo (BucciMobile/SchachKenner) main
    # is branch-protected, so the job skips there and the quote is refreshed
    # when a release is merged (run scripts/update-quote.py in the release PR).
    if: github.repository == 'BucciMobile/SchachKenner-beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rotate the daily quote in README.md
        run: python3 scripts/update-quote.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "daily quote unchanged"
          else
            git commit -m "chore: daily quote $(date -u +%F)"
            git push
          fi
