name: link-check

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]      # every PR must pass the link check

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,206,403,429,503,999 --max-retries 4 --retry-wait-time 6 --timeout 45 --exclude 'playchess\.com' --exclude 'localhost' --exclude 'handbook\.fide\.com' --exclude 'ficsgames\.org' --exclude 'freechess\.org' '**/*.md'  # 503 accepted for rate-limited sites (gutenberg.org); longer timeout/retries for slow hosts (fide, gnu.org); playchess.com serves a wrong TLS cert externally  # playchess.com serves a wrong TLS cert (chessbase.com) — link stays for users, check skipped; localhost = local-only bot web UI (bot/docs), never reachable from CI; handbook.fide.com / ficsgames.org / freechess.org time out from CI runners even after retries (exit code 2) — link-only reference sources, links stay for users, check skipped
